[package]
name = "telegraph-scoring"
version = "0.1.0"
edition = "2021"
description = "Telegraph Protocol — Canonical Semantic WASM Scoring Module"

[lib]
crate-type = ["cdylib"]

[dependencies]
libm = "0.2"
cfg-if = "1.0"
dlmalloc = { version = "0.2", features = ["global"] }

[features]
default = []
real_weights = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
