version: 2
updates:
  - package-ecosystem: npm
    directory: /backend/node
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
