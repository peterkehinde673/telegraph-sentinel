name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-gateway:
    name: Node gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: TVL tests
        run: npm run test:tvl

      - name: Web-search tests
        run: npm run test:web-search

      - name: Miner YAML validation
        run: npm run test:yaml

  root-application:
    name: Root application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  frontend:
    name: Frontend package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  python-risk-engine:
    name: Python risk engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python tests/run_tests.py

  sentinel-ci:
    name: Sentinel CI
    if: always()
    needs:
      - node-gateway
      - root-application
      - frontend
      - python-risk-engine
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          NODE_GATEWAY_RESULT: ${{ needs.node-gateway.result }}
          ROOT_APPLICATION_RESULT: ${{ needs.root-application.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_RISK_ENGINE_RESULT: ${{ needs.python-risk-engine.result }}
        run: |
          test "$NODE_GATEWAY_RESULT" = "success"
          test "$ROOT_APPLICATION_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$PYTHON_RISK_ENGINE_RESULT" = "success"
