name: Sentinel Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/node/package.json
      - run: npm install
      - run: npm run build
      - run: npm run test:tvl
      - run: npm run test:web-search
